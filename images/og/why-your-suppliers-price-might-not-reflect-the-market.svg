<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <style>
      .bg { fill: url(#g); }
      .title { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; fill: #ffffff; font-size:44px; font-weight:700; }
      .subtitle { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; fill: rgba(255,255,255,0.85); font-size:20px; }
      .brand { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; fill: #60a5fa; font-size:18px; font-weight:600; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630" rx="12"/>

  <!-- Left accent -->
  <rect x="64" y="120" width="24" height="390" rx="8" fill="#60a5fa" opacity="0.12" />

  <!-- Title -->
  <foreignObject x="120" y="140" width="960" height="260">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <div style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; color: #fff;">
        <div style="font-size:44px; font-weight:700; line-height:1.05;">Why Your Supplier's Price<br/>Might Not Reflect the Market</div>
        <div style="height:18px"></div>
        <div style="font-size:20px; color: rgba(255,255,255,0.9);">Operational, financial and commercial reasons why quotes diverge from spot prices — and what procurement can do about it.</div>
      </div>
    </div>
  </foreignObject>

  <!-- Footer brand -->
  <g transform="translate(120,470)">
    <rect x="0" y="0" width="420" height="60" rx="8" fill="rgba(255,255,255,0.04)" />
    <text x="22" y="38" class="brand">Skyra CIP — Commodity Market Intelligence</text>
  </g>

  <!-- Decorative bars -->
  <g transform="translate(860,380)">
    <rect x="0" y="0" width="280" height="8" rx="4" fill="#60a5fa" opacity="0.9" />
    <rect x="0" y="22" width="200" height="8" rx="4" fill="#93c5fd" opacity="0.6" />
    <rect x="0" y="44" width="120" height="8" rx="4" fill="#bfdbfe" opacity="0.35" />
  </g>

</svg>
